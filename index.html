<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おばあちゃんちの「ひみつ基地」でおやすみなさい（8ページ版）</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: M PLUS Rounded 1c -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: manipulation;
        }
        .book-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 select-none">

    <!-- ヘッダー -->
    <header class="w-full max-w-2xl flex justify-between items-center py-2 px-4 bg-slate-800/60 backdrop-blur rounded-2xl border border-slate-700/50 shadow-lg">
        <h1 class="text-sm sm:text-base font-bold text-amber-300 flex items-center gap-2">
            <span>⛺</span> おばあちゃんちのひみつ基地
        </h1>
        <div class="flex items-center gap-3">
            <button id="voiceToggleBtn" onclick="toggleVoice()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm px-3 py-1.5 rounded-full transition flex items-center gap-1 shadow">
                🔊 朗読: <span id="voiceStatus">ON</span>
            </button>
            <span id="pageIndicator" class="text-xs sm:text-sm text-slate-300 font-bold bg-slate-700/80 px-3 py-1 rounded-full">1 / 8</span>
        </div>
    </header>

    <!-- メイン絵本エリア -->
    <main class="w-full max-w-2xl my-4 flex-1 flex flex-col justify-center">
        <div id="bookCard" class="bg-gradient-to-b from-slate-800 to-slate-900 border border-slate-700 rounded-3xl book-shadow p-6 sm:p-10 flex flex-col items-center text-center transition-all duration-500 min-h-[420px] sm:min-h-[480px] justify-between relative overflow-hidden">
            
            <!-- 星屑エフェクト背景装飾 -->
            <div class="absolute top-4 left-6 text-amber-200/20 text-2xl animate-pulse">✨</div>
            <div class="absolute bottom-8 right-8 text-indigo-300/20 text-3xl">🌟</div>

            <!-- イラストフレーム -->
            <div id="imageContainer" class="w-full h-44 sm:h-52 bg-slate-950/60 rounded-2xl border border-slate-700/60 flex flex-col items-center justify-center relative shadow-inner mb-6 group">
                <div id="illustrationEmoji" class="text-6xl sm:text-7xl mb-2 transition-transform duration-300 group-hover:scale-110">🌆🏠</div>
                <p id="illustrationDesc" class="text-xs sm:text-sm text-slate-400 px-4">夕暮れの窓辺で、すこし心細そうな男の子</p>
            </div>

            <!-- ストーリーテキスト -->
            <div class="w-full flex-1 flex flex-col justify-center">
                <div class="text-amber-300 text-xs sm:text-sm font-bold mb-2 tracking-wider" id="pageSubtitle">夕暮れのちょっとした不安</div>
                <p id="storyText" class="text-base sm:text-xl text-slate-100 leading-relaxed whitespace-pre-line font-medium">
                    そろそろお外が暗くなってきたよ。今日の夜は、おばあちゃんのお家にお泊まりする日。
                    「ねえ、やっぱりお家にかえりたいな…」
                    主人公のリュウくんは、なんだか胸がチクッとしました。
                </p>
            </div>
        </div>
    </main>

    <!-- ナビゲーションボタン -->
    <footer class="w-full max-w-2xl flex justify-between items-center gap-4 py-2">
        <button id="prevBtn" onclick="changePage(-1)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 px-6 rounded-2xl border border-slate-700 transition disabled:opacity-30 disabled:cursor-not-allowed shadow-md text-sm sm:text-base flex items-center justify-center gap-2">
            ◀ まえのページ
        </button>
        <button id="nextBtn" onclick="changePage(1)" class="flex-1 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold py-3 px-6 rounded-2xl transition shadow-lg text-sm sm:text-base flex items-center justify-center gap-2">
            つぎのページ ▶
        </button>
    </footer>

    <!-- JavaScript ロジック -->
    <script>
        // 8ページの絵本データ
        const pages = [
            {
                title: "ページ 1",
                subtitle: "夕暮れのちょっとした不安",
                text: "そろそろお外が暗くなってきたよ。今日の夜は、おばあちゃんのお家にお泊まりする日。\n「ねえ、やっぱりお家にかえりたいな…」\n主人公のリュウくんは、なんだか胸がチクッとしました。",
                emoji: "🌆🏠",
                desc: "夕暮れの窓辺で、すこし心細そうな男の子"
            },
            {
                title: "ページ 2",
                subtitle: "おばあちゃんの魔法の提案",
                text: "すると、おばあちゃんがにっこり笑って言いました。\n「よし！ 今夜だけの“ひみつ基地”をつくりましょう！」\nリビングの真ん中に大きな白いシーツをかけて、たくさんのクッションを並べたら……\nあっという間に、すてきな秘密のテントが完成しました！",
                emoji: "⛺👵",
                desc: "おばあちゃんと一緒にリビングで大きなテントを作っているところ"
            },
            {
                title: "ページ 3",
                subtitle: "基地の中のひみつ道具",
                text: "「さあ、このなかに冒険の準備をしよう！」\nおばあちゃんが取り出したのは、キラキラ光る懐中電灯と、たくさんの星のシール。\n天井にペタペタ貼っていくと、まるで本物の夜空みたいに輝きだしました。",
                emoji: "🔦✨",
                desc: "ひみつ基地の中で懐中電灯と星のシールを貼るふたり"
            },
            {
                title: "ページ 4",
                subtitle: "星空のフライトと宇宙の地図",
                text: "基地のなかにもぐりこむと、そこはもう外の世界とは違う特別な空間。\nふたりで並んで寝転がり、手作りの星空マップを広げました。\n「あそこにある星は、きっと小さなくまさん座だね」",
                emoji: "🗺️🌟",
                desc: "寝転がりながら星空マップを広げて冒険する子どもとおばあちゃん"
            },
            {
                title: "ページ 5",
                subtitle: "とっておきのおやつタイム",
                text: "冒険の途中で、お腹がグーッと鳴っちゃいました。\nおばあちゃんが魔法のように出してくれたのは、温かいミルクと、あまーいクッキー。\n「ふうふう…おいしいね！」\n一口飲むと、胸の中までポカポカ温かくなりました。",
                emoji: "🥛🍪",
                desc: "基地の中で温かいミルクとクッキーを美味しそうに食べる子ども"
            },
            {
                title: "ページ 6",
                subtitle: "ナイトサファリの影絵あそび",
                text: "今度は懐中電灯の光を壁に向けて、手でかたちを作ってみました。\n「ぴょんぴょん！ うさぎさんだよ」「がおーっ、ライオンだぞ！」\n壁に映る大きな影に、ふたりで大笑い。さっきまでの寂しさは、すっかりどこかへ飛んでいきました。",
                emoji: "🐰🦁",
                desc: "懐中電灯の光で壁に影絵を作って楽しそうに遊ぶ様子"
            },
            {
                title: "ページ 7",
                subtitle: "安心に包まれてお布団へ",
                text: "たくさん遊んで、だんだんまぶたが重くなってきたよ。\nひみつ基地の中にふかふかのお布団を敷いて、横になります。\nおばあちゃんが優しく背中をトントンしながら、子守歌を歌ってくれました。",
                emoji: "🌙🛌",
                desc: "ひみつ基地の中でお布団に横になり、おばあちゃんに見守られる子ども"
            },
            {
                title: "ページ 8",
                subtitle: "夢の中のつづき",
                text: "「おばあちゃん、また明日もここで遊ぼうね」\n「もちろんよ。おやすみなさい、わたしの小さな冒険家さん」\nまぶたを閉じると、お星さまが夢の中で待っている気がしました。\nおばあちゃんのお家は、世界で一番安全で楽しい場所です。",
                emoji: "💤✨",
                desc: "ぐっすり眠る子どもの頭上で星が優しくまたたく夜のイラスト"
            }
        ];

        let currentPage = 0;
        let isVoiceEnabled = true;

        // Web Audio APIによる優しいページめくりチャイム音
        function playChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // A5
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch (e) {
                console.log("Audio not supported or blocked");
            }
        }

        // 音声読み上げ (Web Speech API)
        function speakCurrentPage() {
            if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel();
            
            const p = pages[currentPage];
            const textToSpeech = p.subtitle + "。" + p.text;
            const utterance = new SpeechSynthesisUtterance(textToSpeech);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            
            window.speechSynthesis.speak(utterance);
        }

        // 画面の更新
        function updateBook() {
            const p = pages[currentPage];
            
            const card = document.getElementById('bookCard');
            card.classList.add('opacity-0', 'scale-95');
            
            setTimeout(() => {
                document.getElementById('pageIndicator').innerText = `${currentPage + 1} / ${pages.length}`;
                document.getElementById('pageSubtitle').innerText = p.subtitle;
                document.getElementById('storyText').innerText = p.text;
                document.getElementById('illustrationEmoji').innerText = p.emoji;
                document.getElementById('illustrationDesc').innerText = p.desc;
                
                document.getElementById('prevBtn').disabled = currentPage === 0;
                document.getElementById('nextBtn').innerHTML = currentPage === pages.length - 1 ? "おしまい 🌟" : "つぎのページ ▶";
                
                card.classList.remove('opacity-0', 'scale-95');
                
                speakCurrentPage();
            }, 200);
        }

        // ページ変更
        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 0 && newPage < pages.length) {
                currentPage = newPage;
                playChime();
                updateBook();
            } else if (newPage >= pages.length) {
                alert("最後まで読んでくれてありがとう！おばあちゃんのお家で楽しい夢が見られますように🌙");
            }
        }

        // 音声ON/OFF切り替え
        function toggleVoice() {
            isVoiceEnabled = !isVoiceEnabled;
            const statusSpan = document.getElementById('voiceStatus');
            if (isVoiceEnabled) {
                statusSpan.innerText = "ON";
                speakCurrentPage();
            } else {
                statusSpan.innerText = "OFF";
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            }
        }

        // 初期化
        window.addEventListener('load', () => {
            updateBook();
        });
    </script>
</body>
</html>
